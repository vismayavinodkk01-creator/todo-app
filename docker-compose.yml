services:
  app:
    image: vismayavinodkk/two-tier-todo:latest
    container_name: todo-app
    restart: always
    ports:
      - "8000:8000"
    networks:
      - app-net
    depends_on:
      db:
        condition: service_healthy
    environment:
      HOST: db
    command:

  db:
    image: postgres:latest
    container_name: postgres
    restart: always
    networks:
      - app-net
    volumes:
      - app-vol:/var/lib/postgresql
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: todo_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h localhost -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
volumes:
  app-vol:
networks:
  app-net:
